[project]
name = "quorum-conductor"
version = "0.1.0"
description = "Quorum's conductor: routing, validation, lifecycle, file watching, HTTP/WebSocket server."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quorum Contributors" }]
dependencies = [
    "PyYAML>=6.0.2",
]

[project.scripts]
quorum = "quorum_conductor.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum_conductor"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM"]
# E501: line length is enforced by the formatter, not the linter.
# TC*: TYPE_CHECKING-block rules conflict with `from __future__ import
#      annotations` (which we use everywhere) — annotations are already
#      lazy, so gating imports adds noise without benefit.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
